<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Services - Neural Nexus</title>
  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Premium Styles -->
  <link href="css/style.css" rel="stylesheet">


</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-glass fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">⬅ Back to Home</a>
    </div>
  </nav>

  <div class="sos-container">
    <div class="card-sos text-center">
      <h2 class="display-5 fw-bold mb-2" style="color: var(--navy-900);">Emergency Services</h2>
      <p class="text-muted mb-5">Tap a button below to instantly alert services.</p>

      <div class="row g-3">
        <div class="col-6 col-md-3">
          <button class="btn btn-sos-large btn-police w-100" id="btnPolice">
            <span>🚓</span> Police
          </button>
        </div>
        <div class="col-6 col-md-3">
          <button class="btn btn-sos-large btn-amb w-100" id="btnAmb">
            <span>🚑</span> Ambulance
          </button>
        </div>
        <div class="col-6 col-md-3">
          <button class="btn btn-sos-large btn-fire w-100" id="btnFire">
            <span>🔥</span> Fire
          </button>
        </div>
        <div class="col-6 col-md-3">
          <button class="btn btn-sos-large btn-help w-100" id="btnHelp">
            <span>📞</span> Helpline
          </button>
        </div>
      </div>

      <div class="voice-btn-wrapper">
        <h4 class="fw-bold mb-3">Voice SOS</h4>
        <p class="small text-muted mb-4">Tap microphone and say "Help" or describe the emergency.</p>

        <button class="voice-pulse" id="voiceBtn">🎙️</button>
        <div id="voiceStatus" class="fw-bold text-primary"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script>
    const API_BASE = window.location.origin;

    const notify = (msg, type) => {
      if (window.toaster) window.toaster.show(msg, type);
      else alert(msg);
    };

    function getTouristId() {
      const id = localStorage.getItem('currentTouristId');
      if (!id) {
        notify('No active Tourist ID found. Register on the ID page first.', 'error');
        return null;
      }
      return id;
    }

    // Real browser geolocation instead of a hardcoded coordinate.
    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation not supported in this browser'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          (err) => reject(err),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    async function sendSOS(service) {
      const touristId = getTouristId();
      if (!touristId) return;

      let coords;
      try {
        coords = await getPosition();
      } catch (e) {
        notify('Could not get GPS location — allow location access and try again.', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/sos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tourist_id: touristId, service, lat: coords.lat, lng: coords.lng })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'SOS request failed');
        }
        const data = await res.json();
        // Honest status: this logs the alert and, if Twilio is configured
        // on the backend, sends a real SMS. It does not claim a unit has
        // physically been dispatched — that's outside what this system does.
        const statusText = data.sms_status === 'sent'
          ? 'SOS logged and SMS sent to the dispatch number.'
          : 'SOS logged on the incident dashboard (SMS not configured in this demo).';
        notify(statusText, 'success');
      } catch (e) {
        notify('Error sending SOS: ' + e.message, 'error');
      }
    }

    document.getElementById('btnPolice').addEventListener('click', () => sendSOS('police'));
    document.getElementById('btnAmb').addEventListener('click', () => sendSOS('ambulance'));
    document.getElementById('btnFire').addEventListener('click', () => sendSOS('fire'));
    document.getElementById('btnHelp').addEventListener('click', () => sendSOS('helpline'));

    // Voice SOS: browser speech recognition transcribes the request, then
    // it's sent through the same real /api/sos call as the buttons.
    const voiceBtn = document.getElementById('voiceBtn');
    const status = document.getElementById('voiceStatus');

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SR();
      recognition.lang = 'en-IN';

      recognition.onstart = () => {
        status.innerText = 'Listening... Speak now';
        voiceBtn.classList.add('listening');
      };

      recognition.onend = () => {
        status.innerText = '';
        voiceBtn.classList.remove('listening');
      };

      recognition.onresult = (ev) => {
        const text = ev.results[0][0].transcript;
        notify(`Heard: "${text}" — sending as helpline SOS`, 'info');
        sendSOS('helpline');
      };

      recognition.onerror = (e) => {
        status.innerText = 'Error: ' + e.error;
        voiceBtn.classList.remove('listening');
      };

      voiceBtn.addEventListener('click', () => recognition.start());
    } else {
      status.innerText = 'Voice not supported in this browser.';
    }
  </script>
</body>

</html>
