<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Map | Neural Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Premium Styles -->
  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-glass fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">⬅ Back to Home</a>
    </div>
  </nav>

  <div class="container map-card">
    <h2 class="mb-3">Hyderabad Tourist Safety Map</h2>
    <div id="safetyMap"></div>
    <div class="legend">
      <p><span style="background:red"></span> High-Risk</p>
      <p><span style="background:orange"></span> Medium-Risk</p>
    </div>
    <div class="mt-3 text-center">
      <button id="btnCheckIn" class="btn btn-primary">Check In My Location</button>
      <div id="checkInResult" class="mt-2 fw-bold"></div>
      <p class="small text-muted mt-2">
        Sends your real GPS position to the backend, which checks it against
        these zones server-side and logs an alert if you're inside one —
        the same check a live tracking ping would trigger.
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script>
    const API_BASE = window.location.origin;

    const map = L.map('safetyMap').setView([17.3850, 78.4867], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Fetched from the backend instead of hardcoded here — one source of
    // truth in backend/database.py's risk_zones table, edit a zone there
    // (or via an officer login through /api/zones) and this updates itself.
    async function loadZones() {
      const res = await fetch(`${API_BASE}/api/zones`);
      const zones = await res.json();
      zones.forEach(zone => {
        L.circle([zone.lat, zone.lng], {
          color: zone.risk_level === 'high' ? 'red' : 'orange',
          radius: zone.radius_m,
          fillOpacity: 0.5
        }).addTo(map).bindPopup(`${zone.name} — ${zone.risk_level === 'high' ? 'High' : 'Medium'} Risk`);
      });
    }
    loadZones();

    let userMarker = null;

    document.getElementById('btnCheckIn').addEventListener('click', () => {
      const touristId = localStorage.getItem('currentTouristId');
      const resultEl = document.getElementById('checkInResult');

      if (!touristId) {
        resultEl.innerText = 'No active Tourist ID — register on the ID page first.';
        return;
      }
      if (!navigator.geolocation) {
        resultEl.innerText = 'Geolocation not supported in this browser.';
        return;
      }

      resultEl.innerText = 'Getting location...';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude: lat, longitude: lng } = pos.coords;

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lng]).addTo(map).bindPopup('You are here').openPopup();
        map.setView([lat, lng], 14);

        try {
          const res = await fetch(`${API_BASE}/api/location/ping`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tourist_id: touristId, lat, lng })
          });
          const data = await res.json();

          if (data.inside_risk_zone) {
            const smsNote = data.sms_status === 'sent' ? 'Safety SMS sent to your phone.'
              : data.sms_status === 'simulated' ? '(SMS would be sent — Twilio not configured in this demo.)'
              : data.sms_status ? `SMS status: ${data.sms_status}` : '';
            resultEl.innerText = `⚠️ You're inside a ${data.risk_level}-risk zone: ${data.zone_name}. Alert logged. ${smsNote}`;
            if (window.toaster) toaster.show(`Entered risk zone: ${data.zone_name}`, 'warning');
          } else {
            resultEl.innerText = '✅ You are not in a flagged risk zone.';
          }
        } catch (e) {
          resultEl.innerText = 'Error checking location: ' + e.message;
        }
      }, (err) => {
        resultEl.innerText = 'Could not get location: ' + err.message;
      });
    });
  </script>

</body>

</html>
